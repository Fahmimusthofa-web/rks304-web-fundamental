<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - TokoKu Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen grid md:grid-cols-2 bg-stone-100 text-stone-800">

  <section class="hidden md:flex flex-col justify-end bg-teal-900 text-white p-12">
    <h1 class="text-4xl font-bold leading-tight">TokoKu Admin</h1>
    <p class="mt-3 text-teal-200 max-w-sm">Kelola produk, pengguna, dan statistik toko online Anda dari satu tempat.</p>
  </section>

  <section class="flex items-center justify-center p-6">
    <form action="dashboard.html" class="w-full max-w-sm bg-white rounded-lg shadow p-8 space-y-5">
      <h2 class="text-2xl font-bold">Masuk</h2>
      <div>
        <label for="username" class="block text-sm font-medium mb-1">Username</label>
        <input id="username" name="username" type="text" required
               class="w-full border border-stone-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-600">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium mb-1">Password</label>
        <input id="password" name="password" type="password" required
               class="w-full border border-stone-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-600">
      </div>
      <button type="submit" class="w-full bg-teal-800 hover:bg-teal-700 text-white font-semibold rounded py-2">Login</button>
      <p class="text-sm text-center text-stone-500">Belum punya akun? <a href="register.html" class="text-teal-800 underline">Daftar</a></p>
    </form>
  </section>

</body>
</html>
