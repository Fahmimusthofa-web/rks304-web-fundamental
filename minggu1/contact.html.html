<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Fahmi Zainul Musthofa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header & Navigasi -->
    <header>
        <nav>
            <a href="index.html" class="logo">Fahmi Zainul Musthofa</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Konten Utama -->
    <main>
        <div class="contact-container">
            <div class="page-header" style="margin-bottom: 1.5rem;">
                <h1>Hubungi Saya</h1>
                <p>Punya pertanyaan, tawaran kolaborasi proyek, atau ingin berkonsultasi? Silakan isi formulir di bawah ini.</p>
            </div>

            <!-- Formulir Kontak -->
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap Anda..." required>
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" name="email" placeholder="nama@domain.com" required>
                </div>

                <div class="form-group">
                    <label for="kategori">Kategori / Keperluan</label>
                    <select id="kategori" name="kategori" required>
                        <option value="" disabled selected>Pilih keperluan...</option>
                        <option value="Konsultasi">Konsultasi</option>
                        <option value="Kolaborasi Proyek">Kolaborasi Proyek</option>
                        <option value="Pertanyaan Umum">Pertanyaan Umum</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pesan">Pesan</label>
                    <textarea id="pesan" name="pesan" rows="5" placeholder="Tuliskan pesan Anda secara detail di sini..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Kirim Pesan</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Fahmi Zainul Musthofa. Dibuat untuk Tugas RKS304 Web Fundamental.</p>
    </footer>

</body>
</html>
